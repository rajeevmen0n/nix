name: Mainframe Cache

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'install.sh'
      - 'uname.sh'
      - '.github/workflows/ga605.yml'
      - 'hosts/ga605wi/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Nix
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            extra-platforms = aarch64-linux

      - name: Authenticate to Cachix
        uses: cachix/cachix-action@v14
        with:
          name: mainframe
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build system
        run: |
          nix build .#nixosConfigurations.mainframe.config.system.build.toplevel

      - name: Push to Cachix
        run: |
          cachix push mainframe result
